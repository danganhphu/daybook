name: Bug report
description: Something behaves differently from what it says it does.
labels: [bug]

body:
  - type: markdown
    attributes:
      value: >-
        A security problem does not belong here: report it privately, as SECURITY.md describes.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, step by step, and what came back.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Where
      options:
        - iPhone, Safari or the installed app
        - Android, Chrome or the installed app
        - A desktop browser
        - Telegram
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit
      description: The commit you ran, if you built it yourself.
