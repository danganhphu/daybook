# Hold new releases for a day, and fail if a package's publish trust ever drops
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Versions out for 30+ days predate provenance often enough that age is the better signal
trustPolicyIgnoreAfter: 43200

# CI runs `pnpm audit`; each ignored advisory says why it cannot reach the app
audit:
  level: moderate
  ignore:
    # fflate, pinned by satori: only `next/og` loads it, and the app never imports that
    - GHSA-px8p-9vwx-vf98
    # braces, no fixed release: only build and lint tools match globs with it, on our own patterns
    - GHSA-vfj7-8cjw-p6xm

# An app pins exact versions; the lockfile is not the only record of what runs
savePrefix: ""

# Build scripts run only for packages reviewed here
allowBuilds:
  workerd: true
  # Checks its platform binary matches, fetching it only if the optional dependency is missing
  esbuild: true
  # Only builds from source when no prebuilt binary exists; serves `sass --watch`, which Vite never uses
  "@parcel/watcher": false
permissions:
  drizzle-kit:
    skills: true
